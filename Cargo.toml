[package]
authors = ["Benjamin Matuszewski <benjamin.matuszewski@ircam.fr>"]
edition = "2021"
name = "node-web-audio-api"
version = "2.2.0"

# https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# rlib: a crate can build its own library around this one, with its own
# native AudioWorkletProcessors (src/native_worklet.rs)
crate-type = ["cdylib", "rlib"]

[dependencies]
crossbeam-channel = "0.5"
napi = { version = "3.10", features=["napi9", "tokio_rt", "serde-json"] }
napi-derive = "3.5"
serde = "1"
serde_json = "1"
thread-priority = "3.1"
web-audio-api = "1.7"
# web-audio-api = { path = "../web-audio-api-rs" }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[build-dependencies]
napi-build = "2.3"

[profile.dev]
opt-level = 3

[profile.release]
lto = true
strip = true

[features]
jack = ["web-audio-api/cpal-jack"]
linux = ["web-audio-api/cpal-pipewire", "web-audio-api/cpal-jack"]
wpt = ["web-audio-api/spec-compliant-worklet-inputs"]
diagnostics = ["web-audio-api/diagnostics"]
